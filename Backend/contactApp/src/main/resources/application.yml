spring:
  application:
    name: contactApp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/10pearls}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: false
    hibernate:
      # The schema is owned by the Flyway migrations in db/migration; Hibernate only checks it matches the entities.
      ddl-auto: validate
    properties:
      hibernate:
        globally_quoted_identifiers: true
        format_sql: true
  flyway:
    # Databases created before Flyway was added already have the V1 schema: mark them as V1 and run from V2.
    baseline-on-migrate: true
    baseline-version: 1
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

app:
  jwt:
    # Required, no default: a base64-encoded key of at least 256 bits, set via the JWT_SECRET env var (see .env.example).
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
  mail:
    # When false, emails are not sent. The reset code is then only logged if log-codes is true (local dev only).
    enabled: ${MAIL_ENABLED:false}
    log-codes: ${MAIL_LOG_CODES:false}
    from: ${MAIL_FROM:no-reply@contactapp.local}
  rate-limit:
    # Per-IP limits on login, signup and the password-reset endpoints (see RateLimitFilter).
    enabled: ${RATE_LIMIT_ENABLED:true}
  password-reset:
    otp-expiry-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60
    reset-token-expiry-minutes: 10

server:
  port: 8080
spring:
  application:
    name: contactApp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/10pearls}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: false
    hibernate:
      # The schema is owned by the Flyway migrations in db/migration; Hibernate only checks it matches the entities.
      ddl-auto: validate
    properties:
      hibernate:
        globally_quoted_identifiers: true
        format_sql: true
  flyway:
    # Databases created before Flyway was added already have the V1 schema: mark them as V1 and run from V2.
    baseline-on-migrate: true
    baseline-version: 1
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

app:
  jwt:
    # 256-bit secret, base64-encoded. Override via JWT_SECRET env var in every environment.
    secret: ${JWT_SECRET:Y2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbi1wbGVhc2UtMzItYnl0ZXMtbWluaW11bQ==}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
  mail:
    # When false, emails are not sent and the password-reset code is written to the log instead (local dev only).
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@contactapp.local}
  password-reset:
    otp-expiry-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60
    reset-token-expiry-minutes: 10

server:
  port: 8080